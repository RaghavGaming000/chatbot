<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Headburst</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#000;--bg2:#0a0a0a;--panel:#111113;--panel2:#18181b;--line:#27272a;--txt:#fafafa;--mut:#a1a1aa;--mut2:#71717a;--side:260px}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.auth-screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(800px 400px at 50% -10%,rgba(255,255,255,.06),transparent)}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 28px}
.auth-card h1{font-size:1.5rem;font-weight:700;margin-bottom:6px}.auth-card p{color:var(--mut);font-size:.9rem;margin-bottom:22px}
.field{margin-bottom:14px}.field label{display:block;font-size:.75rem;color:var(--mut2);margin-bottom:6px}
.field input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.field input:focus{border-color:#52525b}
.auth-actions{display:flex;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:10px 16px;font-weight:600;font-size:.9rem}
.btn-primary{background:var(--txt);color:#000}.btn-ghost{border:1px solid var(--line)}
.btn-icon{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut)}.btn-icon:hover{background:var(--panel2);color:var(--txt)}
.auth-err{color:#ef4444;font-size:.85rem;margin-top:10px;min-height:1.2em}
.app{display:none;height:100vh;height:100dvh}.app.show{display:flex}
.sidebar{width:var(--side);flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side-top{padding:14px 12px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.logo-mark{width:28px;height:28px;border-radius:8px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:800}
.side-new{padding:0 12px 10px}.side-new .btn{width:100%;border-radius:12px;padding:10px;border:1px solid var(--line)}
.chat-list{flex:1;overflow:auto;padding:6px 10px}
.chat-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--mut);font-size:.875rem;margin-bottom:2px}
.chat-item:hover,.chat-item.on{background:var(--panel2);color:var(--txt)}
.chat-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .x{opacity:0;color:var(--mut2)}.chat-item:hover .x{opacity:1}
.side-foot{padding:12px;border-top:1px solid var(--line)}
.user-row{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--mut)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px}
.topbar h2{font-size:.95rem;font-weight:600;color:var(--mut)}
.center-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.hero-title{font-size:clamp(2rem,5vw,3rem);font-weight:600;letter-spacing:-.04em;margin-bottom:8px}
.hero-sub{color:var(--mut);margin-bottom:28px}
.suggestions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 14px;font-size:.85rem;color:var(--mut)}.chip:hover{background:var(--panel2);color:var(--txt)}
.thread{display:none;flex:1;overflow:auto;padding:12px 16px}.thread.show{display:block}
.thread-inner{max-width:768px;margin:0 auto}
.msg{display:flex;gap:14px;padding:18px 4px}
.msg .av{width:32px;height:32px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700}
.msg.user .av{background:#27272a}.msg.assistant .av{background:#fafafa;color:#000}
.msg .body{flex:1;line-height:1.65;font-size:.975rem}.msg .role{font-size:.75rem;color:var(--mut2);margin-bottom:4px;font-weight:600}
.msg .body pre{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;margin:10px 0;font-size:.85rem}
.msg .body code{font-family:ui-monospace,monospace;font-size:.88em}
.typing{display:inline-flex;gap:5px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer-wrap{padding:8px 16px 20px}
.composer{max-width:768px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:10px 12px;display:flex;align-items:flex-end;gap:8px}
.composer:focus-within{border-color:#3f3f46}
.composer textarea{flex:1;resize:none;border:0;outline:none;background:transparent;max-height:200px;min-height:24px;line-height:1.5;padding:8px 0}
.send-btn{width:36px;height:36px;border-radius:999px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center}.send-btn:disabled{opacity:.35}
.file-pills{max-width:768px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.75rem;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--mut)}
.hint{text-align:center;color:var(--mut2);font-size:.72rem;margin-top:10px}
.hidden{display:none!important}
@media(max-width:800px){.sidebar{position:fixed;inset:0 auto 0 0;z-index:20}.sidebar.collapsed{transform:translateX(-105%)}}
</style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="logo" style="margin-bottom:18px"><div class="logo-mark">H</div> Headburst</div>
    <h1>Welcome back</h1>
    <p>Sign in to chat. Local AI via Ollama.</p>
    <div class="field"><label>Username</label><input id="username" value="admin"/></div>
    <div class="field"><label>Password</label><input id="password" type="password" value="admin@434"/></div>
    <div class="auth-actions">
      <button class="btn btn-primary" type="button" id="btnLogin" style="flex:1">Log in</button>
      <button class="btn btn-ghost" type="button" id="btnRegister">Register</button>
    </div>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-top"><div class="logo"><div class="logo-mark">H</div> Headburst</div></div>
    <div class="side-new"><button class="btn btn-ghost" type="button" id="btnNew">+ New chat</button></div>
    <div class="chat-list" id="chatList"></div>
    <div class="side-foot"><div class="user-row"><span id="userLabel">@user</span><button class="btn-icon" type="button" id="btnLogout">Logout</button></div></div>
  </aside>
  <main class="main">
    <div class="topbar"><h2 id="chatTitle">Headburst</h2></div>
    <div class="center-stage" id="emptyState">
      <div class="hero-title">Headburst</div>
      <p class="hero-sub">How can I help you today?</p>
      <div class="suggestions">
        <button class="chip" type="button" data-q="Explain quantum computing simply">Explain quantum computing</button>
        <button class="chip" type="button" data-q="Write a Python function to sort dicts by date">Write a Python function</button>
        <button class="chip" type="button" data-q="Help me debug a Node.js express error">Debug Node.js error</button>
        <button class="chip" type="button" data-q="Give me 5 startup ideas in AI tools">AI startup ideas</button>
      </div>
    </div>
    <div class="thread" id="thread"><div class="thread-inner" id="threadInner"></div></div>
    <div class="composer-wrap">
      <div class="file-pills" id="filePills"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message Headburst..."></textarea>
        <label class="btn-icon" style="position:relative;overflow:hidden">+
          <input type="file" id="files" multiple style="position:absolute;inset:0;opacity:0" accept="image/*,.txt,.md,.json,.js,.py,.pdf"/>
        </label>
        <button class="send-btn" type="button" id="btnSend" disabled>↑</button>
      </div>
      <div class="hint">Headburst can make mistakes. Check important info.</div>
    </div>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
let me=null,activeId=null,sending=false,pendingFiles=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));}
function formatMd(t){let s=esc(t);s=s.replace(/```([\s\S]*?)```/g,(_,c)=>'<pre><code>'+c.trim()+'</code></pre>');s=s.replace(/`([^`]+)`/g,'<code>$1</code>');return s.split(/\n{2,}/).map(p=>'<p>'+p.replace(/\n/g,'<br/>')+'</p>').join('');}
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,200)+'px';}
async function api(path,opts={}){const r=await fetch(path,{credentials:'include',...opts});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'failed');return j;}
function showApp(){$('authScreen').classList.add('hidden');$('app').classList.add('show');$('userLabel').textContent='@'+me.username;}
function showAuth(e=''){$('app').classList.remove('show');$('authScreen').classList.remove('hidden');$('authErr').textContent=e;}
async function boot(){try{me=await api('/api/me');showApp();await refreshChats();showEmpty();}catch{showAuth();}}
$('btnLogin').onclick=async()=>{try{me=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});showApp();await refreshChats();showEmpty();}catch(e){$('authErr').textContent=e.message;}};
$('btnRegister').onclick=async()=>{try{me=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});showApp();await refreshChats();showEmpty();}catch(e){$('authErr').textContent=e.message;}};
$('btnLogout').onclick=async()=>{try{await api('/api/logout',{method:'POST'});}catch{}me=null;activeId=null;showAuth();};
async function refreshChats(){const {chats}=await api('/api/chats');const box=$('chatList');if(!chats.length){box.innerHTML='<div style="padding:12px;color:var(--mut2);font-size:.85rem">No chats yet</div>';return;}box.innerHTML=chats.map(c=>`<div class="chat-item ${c.id===activeId?'on':''}" data-id="${c.id}"><span>${esc(c.title||'New chat')}</span><button class="x" type="button" data-del="${c.id}">x</button></div>`).join('');box.querySelectorAll('.chat-item').forEach(el=>el.onclick=ev=>{if(ev.target.dataset.del)return;openChat(el.dataset.id);});box.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=async ev=>{ev.stopPropagation();await api('/api/chats/'+btn.dataset.del,{method:'DELETE'});if(activeId===btn.dataset.del){activeId=null;showEmpty();}await refreshChats();});}
function showEmpty(){$('emptyState').style.display='flex';$('thread').classList.remove('show');$('chatTitle').textContent='Headburst';$('threadInner').innerHTML='';}
function showThread(){$('emptyState').style.display='none';$('thread').classList.add('show');}
function renderMessages(messages){const inner=$('threadInner');inner.innerHTML=(messages||[]).map(m=>{const role=m.role==='user'?'user':'assistant';const av=role==='user'?(me?.username||'U').slice(0,1).toUpperCase():'H';return `<div class="msg ${role}"><div class="av">${esc(av)}</div><div class="body"><div class="role">${role==='user'?'You':'Headburst'}</div>${formatMd(m.content||'')}</div></div>`;}).join('');$('thread').scrollTop=$('thread').scrollHeight;}
async function openChat(id){activeId=id;const {chat}=await api('/api/chats/'+id);$('chatTitle').textContent=chat.title||'Chat';showThread();renderMessages(chat.messages);await refreshChats();}
async function newChat(){const {chat}=await api('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'New chat'})});activeId=chat.id;await refreshChats();showEmpty();$('input').focus();}
$('btnNew').onclick=newChat;
document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{$('input').value=ch.dataset.q;autoGrow($('input'));updateSend();send();});
$('input').oninput=()=>{autoGrow($('input'));updateSend();};
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
$('files').onchange=()=>{pendingFiles=Array.from($('files').files||[]);$('filePills').innerHTML=pendingFiles.map(f=>`<span class="pill">${esc(f.name)}</span>`).join('');updateSend();};
function updateSend(){$('btnSend').disabled=!($('input').value.trim()||pendingFiles.length)||sending;}
async function send(){if(sending)return;const text=$('input').value.trim();if(!text&&!pendingFiles.length)return;if(!activeId){const {chat}=await api('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:text.slice(0,48)||'New chat'})});activeId=chat.id;}showThread();const inner=$('threadInner');const av=(me?.username||'U').slice(0,1).toUpperCase();inner.insertAdjacentHTML('beforeend',`<div class="msg user"><div class="av">${esc(av)}</div><div class="body"><div class="role">You</div>${formatMd(text||'(attachment)')}</div></div>`);inner.insertAdjacentHTML('beforeend',`<div class="msg assistant" id="pendingBot"><div class="av">H</div><div class="body"><div class="role">Headburst</div><div class="typing"><i></i><i></i><i></i></div></div></div>`);$('thread').scrollTop=$('thread').scrollHeight;const fd=new FormData();fd.append('message',text);for(const f of pendingFiles)fd.append('files',f);$('input').value='';autoGrow($('input'));pendingFiles=[];$('files').value='';$('filePills').innerHTML='';sending=true;updateSend();try{const j=await api('/api/chats/'+activeId+'/message',{method:'POST',body:fd});const p=$('pendingBot');if(p)p.remove();inner.insertAdjacentHTML('beforeend',`<div class="msg assistant"><div class="av">H</div><div class="body"><div class="role">Headburst</div>${formatMd(j.assistant?.content||'')}</div></div>`);if(j.title)$('chatTitle').textContent=j.title;await refreshChats();}catch(e){const p=$('pendingBot');if(p)p.querySelector('.body').innerHTML=`<div class="role">Headburst</div><p style="color:#ef4444">${esc(e.message)}</p>`;}finally{sending=false;updateSend();$('thread').scrollTop=$('thread').scrollHeight;$('input').focus();}}
$('btnSend').onclick=send;boot();
</script>
</body>
</html>
