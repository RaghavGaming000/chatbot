<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Headburst Chat</title>
<style>
:root{--bg:#070a12;--card:#111827;--line:#1f2a44;--txt:#e8eefc;--mut:#8b9bb8;--acc:#6366f1;--ok:#22c55e;--err:#f43f5e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#0b1020}
.brand{font-weight:800}.brand span{color:var(--acc)}
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:260px;border-right:1px solid var(--line);padding:12px;overflow:auto;background:#0a0f1c}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow:auto;padding:16px}
.msg{margin:10px 0;padding:12px 14px;border-radius:12px;max-width:900px;line-height:1.5;white-space:pre-wrap}
.msg.user{background:#1e293b;margin-left:auto}
.msg.bot{background:var(--card);border:1px solid var(--line)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
input,textarea,button{font:inherit}
input,textarea{flex:1;background:#0a0f1c;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
button.secondary{background:transparent;border:1px solid var(--line);color:var(--txt)}
button:disabled{opacity:.5}
.chat-item{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;border:1px solid transparent}
.chat-item:hover,.chat-item.active{background:#1e293b;border-color:var(--line)}
.mut{color:var(--mut);font-size:.85rem}
#auth{max-width:380px;margin:80px auto;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:14px}
label{display:block;font-size:.75rem;color:var(--mut);margin:10px 0 4px}
.hidden{display:none!important}
.err{color:var(--err);margin-top:8px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="brand">Headburst <span>Chat</span></div>
  <div class="row" style="margin:0">
    <span class="mut" id="who"></span>
    <button class="secondary" type="button" id="btnLogout" style="display:none" onclick="logout()">Logout</button>
  </div>
</header>

<div id="auth">
  <h2>Sign in</h2>
  <p class="mut">Local AI chatbot — Ollama / optional API</p>
  <label>Username</label>
  <input id="user" value="admin" autocomplete="username"/>
  <label>Password</label>
  <input id="pass" type="password" value="admin@434" autocomplete="current-password"/>
  <div class="row">
    <button type="button" onclick="login()">Login</button>
    <button class="secondary" type="button" onclick="register()">Register</button>
  </div>
  <p class="err" id="authErr"></p>
</div>

<div id="app" class="layout hidden">
  <aside class="sidebar">
    <button type="button" onclick="newChat()" style="width:100%;margin-bottom:12px">+ New chat</button>
    <div id="chatList" class="mut">No chats</div>
  </aside>
  <section class="main">
    <div class="msgs" id="msgs"><p class="mut">Select or create a chat</p></div>
    <div class="composer">
      <input type="file" id="files" multiple style="max-width:180px"/>
      <input id="input" placeholder="Message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"/>
      <button type="button" id="btnSend" onclick="send()">Send</button>
    </div>
  </section>
</div>

<script>
let me=null, activeId=null;

async function login(){
  authErr.textContent='';
  const r=await fetch('/api/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value.trim(),password:pass.value})});
  const j=await r.json();
  if(!r.ok){authErr.textContent=j.error||'failed';return;}
  await boot();
}
async function register(){
  authErr.textContent='';
  const r=await fetch('/api/register',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value.trim(),password:pass.value})});
  const j=await r.json();
  if(!r.ok){authErr.textContent=j.error||'failed';return;}
  await boot();
}
async function logout(){
  await fetch('/api/logout',{method:'POST',credentials:'include'});
  location.reload();
}
async function boot(){
  const r=await fetch('/api/me',{credentials:'include'});
  if(!r.ok){auth.classList.remove('hidden');app.classList.add('hidden');return;}
  me=await r.json();
  auth.classList.add('hidden');
  app.classList.remove('hidden');
  who.textContent='@'+me.username;
  btnLogout.style.display='inline-block';
  await loadChats();
}
async function loadChats(){
  const j=await (await fetch('/api/chats',{credentials:'include'})).json();
  const list=j.chats||[];
  chatList.innerHTML=list.length?list.map(c=>`<div class="chat-item ${c.id===activeId?'active':''}" onclick="openChat('${c.id}')">${esc(c.title||'Chat')}</div>`).join(''):'No chats';
}
async function newChat(){
  const r=await fetch('/api/chats',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'New chat'})});
  const j=await r.json();
  if(!r.ok)return;
  activeId=j.chat.id;
  await loadChats();
  msgs.innerHTML='<p class="mut">Say something…</p>';
}
async function openChat(id){
  activeId=id;
  const j=await (await fetch('/api/chats/'+id,{credentials:'include'})).json();
  const chat=j.chat;
  msgs.innerHTML=(chat.messages||[]).map(m=>`<div class="msg ${m.role==='user'?'user':'bot'}">${esc(m.content||'')}</div>`).join('')||'<p class="mut">Empty</p>';
  msgs.scrollTop=msgs.scrollHeight;
  await loadChats();
}
async function send(){
  if(!activeId){await newChat();}
  const text=input.value.trim();
  if(!text&&!files.files.length)return;
  const fd=new FormData();
  fd.append('message',text);
  for(const f of files.files)fd.append('files',f);
  input.value='';files.value='';
  btnSend.disabled=true;
  const r=await fetch('/api/chats/'+activeId+'/message',{method:'POST',credentials:'include',body:fd});
  const j=await r.json();
  btnSend.disabled=false;
  if(!r.ok){alert(j.error||'failed');return;}
  await openChat(activeId);
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));}
boot();
</script>
</body>
</html>
